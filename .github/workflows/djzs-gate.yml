name: djzs-gate
on:
  push: { branches: [main, "fix/**", "feat/**"] }
  pull_request: {}
  schedule:
    # Two crons, and every job below says which one it answers to. A job with no `if` would run on BOTH — which
    # is how an hourly probe quietly turns a weekly full Dune re-verification into an hourly one.
    - cron: "17 6 * * 1" # Monday 06:17 UTC: full Dune re-verification of every record
    - cron: "41 * * * *" # hourly: public-site liveness ONLY (site-liveness job). Minute 41, not 0 — GitHub's
                         # scheduler is most backed up on the hour, and a delayed probe is a late outage report.
jobs:
  engine-integrity:
    if: github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 } # HEAD~1 needed by q3-verify DUNE_REVERIFY=changed
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: PM engine — exhaustive verdict-space test
        run: npx tsx tests/pm-engine-integrity.ts
      - name: LF engine — exhaustive verdict-space test (perp path, LF-v1.2)
        run: npx tsx tests/lf-engine-integrity.ts
      - name: verify_perp_trade pipeline — offline, fake model
        run: npx tsx tests/verify-perp-trade.test.ts
      - name: consensus merge — objective facts survive a dissenting sample
        run: npx tsx tests/merge-fix.test.ts
      - name: coerceField — bare stated values are PRESENT, never ABSENT
        run: npx tsx tests/coerce.test.ts
  worker-builds:
    if: github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 } # HEAD~1 needed by q3-verify DUNE_REVERIFY=changed
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: root deps (engine imports zod from repo root)
        run: npm ci
      - run: npm install
        working-directory: djzs-trust-mcp
      - name: djzs-trust-mcp — bundle (no deploy, no secrets)
        run: npx wrangler deploy --dry-run --outdir /tmp/dry
        working-directory: djzs-trust-mcp
      - name: Target-System — a signed claim or null, NEVER a bare unsigned value
        run: npx tsx test/target-system.test.mjs
        working-directory: djzs-trust-mcp
      - name: PoL certificate — offline assembly/signing harness
        run: npx tsx harness/pol-offline.ts
        working-directory: djzs-trust-mcp
      - name: Corrections — registry and anchored record cannot drift apart
        run: npx tsx test/corrections.test.mjs
        working-directory: djzs-trust-mcp
      - name: Correction anchor — key stays in the Worker; route refuses before it signs
        run: npx tsx test/correction-anchor.test.mjs
        working-directory: djzs-trust-mcp

  q3-integrity:
    if: github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 } # HEAD~1 needed by q3-verify DUNE_REVERIFY=changed
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Q3 — §3 pool admission matcher (v1.5 categories, v1.8 recurrence, v1.9 duration)
        run: npx tsx tests/q3/pool-matcher.test.ts
      - name: Q3 — /verify mirrors anchors.json (generated block, no drift)
        run: npx tsx tests/q3/render-anchors.ts --check
      - name: Q3 — recompute every record hash; match every anchor to its Irys item
        run: npx tsx tests/q3/q3-verify.ts
        # Named cron, not "any schedule": the hourly cron must never reach a full Dune re-verification, and it
        # would the moment this job's `if` above were loosened. Two guards, because one of them costs credits.
        env: { DUNE_API_KEY: "${{ secrets.DUNE_API_KEY }}", DUNE_REVERIFY: "${{ github.event.schedule == '17 6 * * 1' && 'always' || 'changed' }}" }

  # Is the site a visitor sees actually up, and is it the current one? Everything above grades the TREE. This is
  # the only job that asks what is DEPLOYED — the 2026-09-16 outage (SCAN_SPEC §12.2) was invisible to all of it.
  site-liveness:
    # Hourly cron only. Deliberately NOT on push/pull_request: a PR that adds an anchor is legitimately ahead of
    # the deployed /verify, so grading branches on deploy state would produce a red that means nothing. Also no
    # workflow_dispatch — this gate carries DUNE_API_KEY, and CLAUDE.md §5 rules out manual CI runs of it.
    if: github.event_name == 'schedule' && github.event.schedule == '41 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup-node, no npm ci: the probe is dependency-free Node so that it can only go red about the site.
      - name: djzs.ai — every public page answers 200, and /verify carries the latest anchor
        run: node tests/q3/site-liveness.mjs
